name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: go test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go vet ./...
      - run: go test -race -count=1 -p 4 ./...

  clients:
    name: psql and psycopg
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: install psql 18 (the expected output was recorded with psql 18)
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-18
      - run: test/psql/run.sh
        env:
          PSQL: /usr/lib/postgresql/18/bin/psql
      - run: python -m pip install "psycopg[binary]"
      - run: python test/python/test_psycopg.py

  crash:
    name: crash and differential tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: install sqlite3
        run: sudo apt-get update && sudo apt-get install -y sqlite3
      - run: BASALT_CRASH_TEST=1 BASALT_CRASH_ROUNDS=8 go test -count=1 -run TestCrashKill -v ./test/crash/
      - run: BASALT_DIFFTEST=1 go test -count=1 -run TestDifferential -v ./test/difftest/

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: gofmt
        run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...
      - name: go mod tidy
        run: go mod tidy && git diff --exit-code go.mod go.sum
